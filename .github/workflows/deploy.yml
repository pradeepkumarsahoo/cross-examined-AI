# Build the image, migrate the database, roll out infra/k8s and smoke-test through the web screen.
# Authenticates to Google Cloud with Workload Identity Federation: no JSON keys anywhere.
#
# Repository settings -> Secrets and variables -> Actions (Variables or Secrets; either works):
#   GCP_PROJECT_ID, GCP_REGION, GCP_WIF_PROVIDER, GCP_DEPLOYER_SA, PUBLIC_WEB (optional, "true")
# Values come from `terraform output` (see README, "Deploy to Google Cloud").
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false # never cut a rollout or migration off half way

permissions:
  contents: read
  id-token: write # for Workload Identity Federation

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID || secrets.GCP_PROJECT_ID }}
  REGION: ${{ vars.GCP_REGION || secrets.GCP_REGION || 'asia-south1' }}
  WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER || secrets.GCP_WIF_PROVIDER }}
  DEPLOYER_SA: ${{ vars.GCP_DEPLOYER_SA || secrets.GCP_DEPLOYER_SA }}
  PUBLIC_WEB: ${{ vars.PUBLIC_WEB || secrets.PUBLIC_WEB || 'false' }}
  CLUSTER: crossexam-gke
  REPOSITORY: crossexam
  NAMESPACE: crossexam

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: crossexam
          POSTGRES_PASSWORD: crossexam
          POSTGRES_DB: crossexam
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U crossexam" --health-interval 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m ruff check --no-cache .
      - name: Unit and end-to-end tests (scripted model, no key)
        env:
          TEST_DATABASE_URL: postgresql+psycopg://crossexam:crossexam@localhost:5432/crossexam_test
          REDIS_URL: redis://localhost:6379/15
        run: python -m pytest -q -p no:cacheprovider

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check settings
        run: |
          missing=""
          for v in PROJECT_ID WIF_PROVIDER DEPLOYER_SA; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository variables:$missing (see README, Deploy to Google Cloud, step 6)"
            exit 1
          fi
          echo "IMAGE=${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/crossexam:${GITHUB_SHA::12}" >> "$GITHUB_ENV"

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: gke-gcloud-auth-plugin

      - name: Build and push the image
        run: |
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          docker build -t "$IMAGE" .
          docker push "$IMAGE"

      - uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.CLUSTER }}
          location: ${{ env.REGION }}

      - name: Migrate the database
        run: |
          # A Job's pod template is immutable: remove the previous run before applying the new one.
          kubectl -n "$NAMESPACE" delete job crossexam-migrate --ignore-not-found --wait=true
          kubectl kustomize infra/k8s/migrate | envsubst '${IMAGE} ${PROJECT_ID}' | kubectl apply -f -
          if ! kubectl -n "$NAMESPACE" wait --for=condition=complete job/crossexam-migrate --timeout=900s; then
            echo "::error::Migration failed"
            kubectl -n "$NAMESPACE" describe job crossexam-migrate | tail -30 || true
            kubectl -n "$NAMESPACE" logs job/crossexam-migrate --all-containers --tail=200 || true
            exit 1
          fi
          kubectl -n "$NAMESPACE" logs job/crossexam-migrate --tail=50 || true

      - name: Roll out
        run: |
          overlay=infra/k8s/app
          [ "$PUBLIC_WEB" = "true" ] && overlay=infra/k8s/public
          echo "Applying $overlay"
          kubectl kustomize "$overlay" | envsubst '${IMAGE} ${PROJECT_ID}' | kubectl apply -f -
          for d in crossexam-api crossexam-web crossexam-reader crossexam-agent crossexam-flower; do
            if kubectl -n "$NAMESPACE" get deployment "$d" >/dev/null 2>&1; then
              kubectl -n "$NAMESPACE" rollout status "deployment/$d" --timeout=600s
            fi
          done

      - name: Smoke test (web screen -> API -> database)
        run: |
          kubectl -n "$NAMESPACE" port-forward svc/crossexam-web 18080:80 >/tmp/pf.log 2>&1 &
          pf=$!
          trap 'kill $pf' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:18080/healthz >/dev/null 2>&1; then break; fi
            sleep 2
          done
          curl -fsS --retry 5 --retry-delay 3 --retry-all-errors http://localhost:18080/api/stats | tee /tmp/stats.json
          python3 -c "import json; d=json.load(open('/tmp/stats.json')); assert 'automation_rate' in d"
          echo
          echo "Deployed $IMAGE"
